name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Avow.xcodeproj \
            -scheme Avow \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/Avow.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avow-xcresult
          path: ${{ runner.temp }}/Avow.xcresult
          if-no-files-found: ignore
